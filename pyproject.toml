[project]
name = "smectic-transport"
version = "1.0.0"
description = "Active Brownian swimmers in smectic-A textures (planar, focal conic domain, FCD array): model and simulation code for 'Geometry-controlled active transport in smectic textures'."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yhony M. Arce" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = [
    "numba-cuda[cu12]>=0.10",
    "numpy<2.4",   # numba-cuda still uses np.row_stack, removed in NumPy 2.4
]

[project.scripts]
smectic-transport = "smectic_transport.cli:main"

[dependency-groups]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smectic_transport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
